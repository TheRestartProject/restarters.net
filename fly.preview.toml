# Template for every preview app. Two callers substitute the placeholders:
#
#   .github/workflows/pr-preview.yml   per-PR previews  restarters-pr-<N>
#   .circleci/config.yml (deploy-fly-dev)  the develop branch  restarters-dev
#
# develop is deliberately just another preview: same disposable database, same
# suspend-on-idle teardown, same read-only credentials. The only differences
# are the four placeholders below. Do not deploy this file directly.
#
#   __APP_NAME__    fly app name        restarters-pr-7 / restarters-dev
#   __APP_TITLE__   human-facing name   Restarters PR #7 / Restarters develop
#   __BASE_URL__    the app's origin    https://restarters-pr-7.fly.dev
#                                       https://restarters-dev.fly.dev
#   __SENTRY_ENV__  Sentry environment  preview / dev
#
# Each preview runs its branch's code against a local embedded MariaDB restored
# from the most recent hourly production backup at cold boot. The machine
# suspends after ~5 min idle (whole-VM snapshot, so the DB stays loaded and
# resume is sub-second). PR apps are destroyed when the PR closes;
# restarters-dev is long-lived and simply sleeps.
#
# Secrets are set once at app creation (see docs/fly-deployment.md): a fresh
# per-app APP_KEY, BASIC_AUTH_PASSWORD, read-only Tigris credentials, and
# read-only Google Drive credentials for the backup restore.

app = "__APP_NAME__"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.fly"
  [build.args]
    STARTUP_SCRIPT = "preview-startup.sh"

[env]
  APP_NAME = "__APP_TITLE__"
  APP_ENV = "staging"
  APP_DEBUG = "false"
  APP_URL = "__BASE_URL__"
  # The Nuxt SPA is served same-origin (nginx → Nitro on :3000); the SPA's
  # apiBase is this host (API paths already include /api/v2). FRONTEND_URL keeps
  # any residual Laravel link-building on-host instead of the localhost default.
  FRONTEND_URL = "__BASE_URL__"
  NUXT_PUBLIC_API_BASE = "__BASE_URL__"
  # Local embedded MariaDB (restored from backup at cold boot; 127.0.0.1 only)
  DB_CONNECTION = "mysql"
  DB_HOST = "127.0.0.1"
  DB_PORT = "3306"
  DB_DATABASE = "restarters"
  DB_USERNAME = "restarters"
  DB_PASSWORD = "restarters_preview"
  CACHE_DRIVER = "file"
  SESSION_DRIVER = "file"
  # Background jobs exactly as production does them: dispatch to the local
  # `jobs` table, worked by the supervisord queue-worker (which runs
  # `queue:work database` regardless of this setting) and kept alive by the
  # queue-watchdog cron. Never "sync" - that blocks the dispatching request
  # while the job runs, which is both slow and unlike production.
  #
  # This does not hold the machine awake: Fly suspends on the proxy seeing no
  # requests, not on CPU activity. A job dispatched moments before suspend
  # simply waits in the table and is worked when the next request resumes the
  # machine.
  QUEUE_CONNECTION = "database"
  SESSION_DOMAIN = ""
  LOG_CHANNEL = "stderr"
  FILESYSTEM_DISK = "s3"
  AWS_DEFAULT_REGION = "auto"
  AWS_ENDPOINT = "https://fly.storage.tigris.dev"
  AWS_USE_PATH_STYLE_ENDPOINT = "true"
  # Previews must never reach real external services.
  FEATURE__WIKI_INTEGRATION = "false"
  FEATURE__DISCOURSE_INTEGRATION = "false"
  FEATURE__WORDPRESS_INTEGRATION = "false"
  # Reads come from the shared live bucket; writes are disabled (and the
  # Tigris credentials are read-only anyway).
  FEATURE__IMAGE_UPLOAD = "false"
  SENTRY_ENVIRONMENT = "__SENTRY_ENV__"
  # Mail goes to the shared Mailpit instance, never to real inboxes.
  MAIL_MAILER = "smtp"
  MAIL_HOST = "restarters-dev-mail.internal"
  MAIL_PORT = "1025"
  MAIL_ENCRYPTION = ""
  MAIL_FROM_ADDRESS = "preview@restarters.dev"
  MAIL_FROM_NAME = "__APP_TITLE__"
  MAILPIT_URL = "https://restarters-dev-mail.fly.dev"
  # Show the red branch banner. Its label is FLY_APP_NAME, which Fly injects
  # (config/restarters.php:44), so it reads e.g. "restarters-pr-7" or
  # "restarters-dev" without needing a placeholder here.
  APP_SHOW_BRANCH = "true"
  BASIC_AUTH_ENABLED = "true"
  # Table type constants
  TBL_USERS = "1"
  TBL_GROUPS = "2"
  TBL_EVENTS = "3"
  TBL_DEVICES = "4"
  TBL_IMAGES = "5"
  TBL_LINKS = "6"
  # Device status constants
  DEVICE_FIXED = "1"
  DEVICE_REPAIRABLE = "2"
  DEVICE_DEAD = "3"
  # Category IDs
  MISC_CATEGORY_ID = "46"
  MISC_CATEGORY_ID_POWERED = "46"
  MISC_CATEGORY_ID_UNPOWERED = "50"
  # Impact calculation constants
  DISPLACEMENT_VALUE = "0.5"
  EMISSION_RATIO_UNPOWERED = "17.70147059"
  EMISSION_RATIO_POWERED = "32.06679233"
  # Session
  # Shared across every preview app - cookies are host-scoped, so PR previews
  # and restarters-dev cannot collide.
  SESSION_COOKIE = "restarters_preview_session"
  SESSION_LIFETIME = "10080"
  SESSION_TABLE = "laravel_sessions"
  # Misc
  L5_SWAGGER_GENERATE_ALWAYS = "false"
  VITE_MANIFEST_PATH = "public/build/manifest.json"

[http_service]
  internal_port = 80
  force_https = true
  # suspend snapshots the whole VM (needs memory <= 2GB and NO swap - see [[vm]]).
  # Resume is sub-second with MariaDB still loaded. If Fly discards the
  # snapshot the machine cold-boots and preview-startup.sh re-restores.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    port = 80
    type = "http"
    interval = "30s"
    timeout = "10s"
    # The warming-page nginx binds port 80 within seconds of boot, so the
    # check passes long before the DB restore completes. Poll
    # /_preview_status to know when the site is actually usable.
    grace_period = "120s"
    method = "GET"
    path = "/robots.txt"

# No [mounts]: logs go to stderr, the DB lives on the (ephemeral) rootfs and
# is re-restored from backup on every cold boot. Nothing to persist.

[[vm]]
  size = "performance-1x"
  # 2048MB is the suspend ceiling. Deliberately NO swap_size_mb: machines
  # with swap cannot suspend (Fly silently falls back to stop, which would
  # force a full re-restore on every wake).
  memory = 2048
