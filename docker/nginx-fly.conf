user www-data;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SHA-256 HMAC keys are 64 chars — need larger map hash buckets.
    map_hash_bucket_size 128;

    # Allow /outbound/ to be embedded in iframes by external sites (e.g. therestartproject.org).
    # Empty string means nginx omits the header entirely.
    map $request_uri $x_frame_options {
        ~^/outbound/   "";
        default        "SAMEORIGIN";
    }

    # Generated at startup by startup.sh: maps $cookie_site_auth → $auth_gate_valid (1=ok, 0=fail)
    include /etc/nginx/auth-gate-map.conf;

    # Rate-limit the site-gate login to slow brute-forcing of the shared
    # password. Keyed on Fly-Client-IP (set by the Fly proxy, not spoofable
    # through it); requests without the header (local dev) are not limited.
    limit_req_zone $http_fly_client_ip zone=auth_login:1m rate=10r/m;

    log_format timed '$http_x_forwarded_for ($remote_addr) - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        root /var/www/public;

        index index.php;

        charset utf-8;

        # Cookie-based site gate (dev/staging only). Generated by startup.sh:
        #   enabled:  auth_request /_auth_check; error_page 401 = @auth_gate;
        #   disabled: empty file
        # auth_request makes a subrequest to /_auth_check on every request. If the
        # PHP script returns 200 (valid cookie) the request proceeds; if 401, nginx
        # serves the @auth_gate named location which redirects to the login page.
        # No WWW-Authenticate header is ever sent, so the browser never shows a dialog.
        include /etc/nginx/auth-gate.conf;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options $x_frame_options always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS - Fly.io terminates TLS, but this tells browsers to always use HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Auth subrequest handler — pure nginx, no PHP-FPM.
        # $auth_gate_valid is set by the map in auth-gate-map.conf (generated at startup).
        # Use if with literal codes: nginx evaluates return $var as a URL redirect,
        # not a status code, so we must use literal numeric codes here.
        #
        # IMPORTANT: override the server-level error_page 401 = @auth_gate here.
        # Without this, when return 401 fires, nginx applies the server-level
        # error_page and converts it to a 302 redirect, which auth_request then
        # sees as an unexpected status and returns 500 to the client.
        location = /_auth_check {
            internal;
            error_page 401 =401 @auth_check_denied;
            if ($auth_gate_valid) {
                return 200;
            }
            return 401;
        }

        # Used only by /_auth_check to return a clean 401 to auth_request.
        # Nginx's anti-recursion flag prevents error_page from firing again here.
        location @auth_check_denied {
            return 401;
        }

        # Login form — exempt from auth_request so it's always reachable.
        location = /_login {
            auth_request off;
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/public/_auth_login.php;
            include fastcgi_params;
        }

        # PR-preview boot status (written by preview-startup.sh; no PII).
        # 404s everywhere else — the file only exists on preview apps.
        location = /_preview_status {
            auth_request off;
            access_log off;
            default_type application/json;
            alias /var/www/storage/framework/preview-status.json;
            add_header Cache-Control "no-store";
        }

        # Redirect to login, preserving the originally requested URL.
        location @auth_gate {
            return 302 /_login?next=$request_uri;
        }

        # Proxy /uploads/ to Tigris S3 bucket (read-only).
        # TIGRIS_BUCKET_URL and TIGRIS_BUCKET_HOST are substituted at startup
        # via envsubst in startup.sh.
        location /uploads/ {
            limit_except GET HEAD {
                deny all;
            }

            # Fly.io internal DNS resolver — required for nginx to resolve
            # the Tigris hostname at request time rather than only at startup.
            resolver [fdaa::3] 8.8.8.8 valid=300s;
            resolver_timeout 5s;

            set $tigris_upstream ${TIGRIS_BUCKET_URL};
            # When proxy_pass uses a variable, nginx does NOT strip the
            # location prefix automatically. We must rewrite it ourselves.
            rewrite ^/uploads/(.*)$ /$1 break;
            proxy_pass $tigris_upstream;
            proxy_ssl_server_name on;
            proxy_set_header Host ${TIGRIS_BUCKET_HOST};
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-meta-s3cmd-attrs;
            proxy_intercept_errors on;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Dead research-tool prefixes + /workbench: the Blade pages are gone;
        # send old links to the Talk archive post (was 34 Laravel routes).
        location ~* ^/(faultcat|misccat|mobifix|mobifixora|tabicat|printcat|battcat|dustup|workbench)(/|$) {
            return 301 https://talk.restarters.net/t/our-work-on-repair-data/1150;
        }

        # ── Laravel (php-fpm) surface ────────────────────────────────────────
        # The API plus the deliberately small set of server-rendered routes we
        # still serve from Laravel: the SSO bridge, anonymous data exports,
        # calendar feeds, and the embeddable stats widgets partners iframe.
        # Everything else is the Nuxt SPA (see `location /` → @nuxt). These are
        # `^~` prefixes so they win over the `\.php$` regex and the SPA default.
        # (The old emailed-link redirectors — user/reset, user/register,
        # party|group/invite, accept-invite — are gone: the SPA owns those exact
        # paths natively now, so they fall through to @nuxt.)
        location ^~ /api/         { try_files $uri /index.php?$query_string; }
        location ^~ /auth/bridge  { try_files $uri /index.php?$query_string; }
        location ^~ /discourse/   { try_files $uri /index.php?$query_string; }
        location ^~ /export/      { try_files $uri /index.php?$query_string; }
        location ^~ /calendar/    { try_files $uri /index.php?$query_string; }
        location ^~ /outbound/    { try_files $uri /index.php?$query_string; }
        location ^~ /group/stats/ { try_files $uri /index.php?$query_string; }
        location ^~ /admin/stats/ { try_files $uri /index.php?$query_string; }
        location ^~ /party/stats/ { try_files $uri /index.php?$query_string; }

        # ── Nuxt SPA origin ──────────────────────────────────────────────────
        # Serve an on-disk file if one exists (Laravel's Vite widget/wiki build
        # assets: /build, /global, /css, /js, /icons, /fonts, and the /images
        # that live Laravel-side), otherwise hand the request to the Nuxt Nitro
        # server, which serves the SPA HTML, its /_nuxt/* build output and its
        # own public/ assets.
        # The root must go to the Nuxt server explicitly: `try_files $uri` can
        # match the public/ directory itself and fall through to index.php
        # (Laravel), which would 302 to the SPA origin and loop. A nonexistent
        # probe path forces the @nuxt fallback.
        location = / {
            try_files /_spa_root_never @nuxt;
        }

        location / {
            try_files $uri @nuxt;
        }

        location @nuxt {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
        }

        location = /favicon.ico { access_log off; auth_request off; }
        location = /robots.txt  { access_log off; auth_request off; }

        # Static assets — no auth check needed, served directly from disk.
        location /build/ { auth_request off; expires 1y; add_header Cache-Control "public, immutable"; }
        # /images is shared: Laravel-side widget/wiki images live on disk; the
        # SPA's own images live in the Nitro server's public/. Serve the disk
        # copy if present, else fall through to Nuxt.
        location /images/ { auth_request off; expires 7d; try_files $uri @nuxt; }

        location = /fpm-status {
            auth_request off;
            allow 127.0.0.1;
            allow ::1;
            allow fdaa::/16;
            deny all;
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_param SCRIPT_FILENAME /fpm-status;
            include fastcgi_params;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
            fastcgi_read_timeout 120s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
