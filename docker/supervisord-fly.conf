[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Nuxt SPA origin: the standalone Nitro Node server (client/.output) that nginx
# proxies every non-/api, non-widget request to (see docker/nginx-fly.conf's
# `@nuxt`). Binds 127.0.0.1:3000 only — never exposed directly; nginx fronts it.
# Inherits the Fly env (incl. NUXT_PUBLIC_API_BASE) from supervisord; PORT/HOST
# are pinned here so Nitro listens where nginx expects.
[program:nuxt]
command=node /var/www/client/.output/server/index.mjs
directory=/var/www/client
environment=PORT="3000",HOST="127.0.0.1",NITRO_PORT="3000",NITRO_HOST="127.0.0.1"
user=www-data
autostart=true
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --daemonize no --save "" --appendonly no --loglevel warning
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sysstat]
command=/bin/bash -c "while true; do /usr/lib/sysstat/sa1 1 1; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
