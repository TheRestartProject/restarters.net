# Run hourly from cron (see Dockerfile.fly).  maxsize rotates a log early, at the next hourly run, once it
# passes that size, so a busy day can't fill the /var/log volume before the daily rotation.

/var/log/nginx/access.log /var/log/nginx/error.log {
    daily
    maxsize 100M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
    endscript
}

/var/log/php-fpm-slow.log {
    daily
    maxsize 50M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/laravel/*.log {
    daily
    maxsize 100M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Written by the cron scripts in docker/ (db-backup.sh, restart-yesterday.sh, queue-watchdog.sh) and the
# non-production startup scripts.
/var/log/db-backup.log /var/log/queue-watchdog.log /var/log/yesterday-restore.log /var/log/preview-restore.log {
    weekly
    maxsize 20M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
