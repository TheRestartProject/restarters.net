# https://taskfile.dev

version: "3"

# Load environment-specific .env file
dotenv:
  - .env

env:
  UID:
    sh: |
      if command -v id >/dev/null 2>&1; then
        id -u
      else
        echo "1000"
      fi
  GID:
    sh: |
      if command -v id >/dev/null 2>&1; then
        id -g
      else
        echo "1000"
      fi

vars:
  DOCKER_CMD:
    sh: command -v docker-compose &> /dev/null && echo "docker-compose" || echo "docker compose"
  COMPOSE_PROFILES:
    map:
      all: "'*'"
      core: "core"
      debug: "debug"
      discourse: "discourse"

tasks:
  # Default task
  default:
    desc: List all tasks
    cmds:
      - task --list

  # Docker container management tasks
  docker:up-*:
    desc: Start Docker containers for a given profile (Usage - task docker:up-[core|debug|discourse|all])
    summary: |
      Start a set of Docker containers at a given time. The core services are always started with any profile.
      For just the core services, use:
      task docker:up-core

      To include phpMyAdmin and Mailhog, use:
      task docker:up-debug

      To include the Discourse set of containers, use:
      task docker:up-discourse

      If you want to start all containers, use:
      task docker:up-all

    requires: &PROFILE_REQUIRES
      vars:
        - name: PROFILE
          enum: [core, debug, discourse, all]
    
    vars: &PROFILE_VARS
      PROFILE: "{{index .MATCH 0}}"

    cmds:
      - '{{.DOCKER_CMD}} --profile {{ index .COMPOSE_PROFILES .PROFILE }} up -d'

  docker:down-*:
    desc: Stop Docker containers for a given profile (Usage - task docker:down-[core|debug|discourse|all])
    summary: |
      Stop a set of Docker containers at a given time. The core services are always stopped with any profile.
      For just the core services, use:
      task docker:down-core

      To include phpMyAdmin and Mailhog, use:
      task docker:down-debug

      To include the Discourse set of containers, use:
      task docker:down-discourse

      If you want to stop all containers, use:
      task docker:down-all

    requires: *PROFILE_REQUIRES
    
    vars: *PROFILE_VARS

    cmds:
      - '{{.DOCKER_CMD}} --profile {{ index .COMPOSE_PROFILES .PROFILE }} down'

  docker:rebuild-*:
    desc: Rebuild Docker containers for a given profile (Usage - task docker:rebuild-[core|debug|discourse|all])
    summary: |
      Rebuild a set of Docker containers at a given time. The core services are always rebuilt with any profile.
      For just the core services, use:
      task docker:rebuild-core

      To include phpMyAdmin and Mailhog, use:
      task docker:rebuild-debug

      To include the Discourse set of containers, use:
      task docker:rebuild-discourse

      To rebuild all containers, use:
      task docker:rebuild-all

    requires: *PROFILE_REQUIRES
    
    vars: *PROFILE_VARS

    cmds:
      - '{{.DOCKER_CMD}} --profile {{ index .COMPOSE_PROFILES .PROFILE }} down -v --rmi all'
      - '{{.DOCKER_CMD}} --profile {{ index .COMPOSE_PROFILES .PROFILE }} up -d'

  docker:restart-*:
    desc: Restart Docker containers for a given profile (Usage - task docker:restart-[core|debug|discourse|all])
    summary: |
      Restart a set of Docker containers at a given time. The core services are always restarted with any profile.
      For just the core services, use:
      task docker:restart-core

      To include phpMyAdmin and Mailhog, use:
      task docker:restart-debug

      To include the Discourse set of containers, use:
      task docker:restart-discourse

      To restart all containers, use:
      task docker:restart-all

    requires: *PROFILE_REQUIRES
    
    vars: *PROFILE_VARS

    cmds:
      - '{{.DOCKER_CMD}} --profile {{ index .COMPOSE_PROFILES .PROFILE }} restart'


  docker:logs:
    desc: Show the logs for the core application container.
    cmds:
      - cmd: docker logs -f restarters
        ignore_error: true


  docker:shell:
    desc: Open a shell into the core application container.
    cmds:
      - cmd: docker exec -it restarters bash
        ignore_error: true

  docker:run:bash:
    desc: Run a bash command in the core application container.
    summary: |
      Run a bash command in the core application container. To pass the arguments, use the -- flag.
      For example, to run the ls command, use:
      task docker:run:bash -- ls -la

    cmds:
      - docker exec -it restarters bash -c "{{ .CLI_ARGS }}"

  docker:run:artisan:
    desc: Run an artisan command in the core application container.
    summary: |
      Run an artisan command in the core application container. To pass the arguments, use the -- flag.
      For example, to run the migrate command, use:
      task docker:run:artisan -- migrate

    cmds:
      - docker exec -it restarters php artisan "{{ .CLI_ARGS }}"

  docker:swagger:generate:
    desc: Regenerate the OpenAPI (Swagger) spec from the @OA annotations.
    summary: |
      Regenerate storage/api-docs/api-docs.json from the @OA annotations under app/.
      The spec is a gitignored build artifact; CI regenerates it before the PHPUnit
      and Playwright jobs. Run this after editing any @OA annotation.
    cmds:
      - docker exec restarters php artisan l5-swagger:generate

  docker:swagger:lint:
    desc: Regenerate the OpenAPI spec and check document-level integrity (dangling refs, security schemes, duplicate operationIds).
    cmds:
      - docker exec restarters php artisan l5-swagger:generate
      - docker exec restarters php tools/openapi-lint.php

  docker:vite:
    desc: Start Vite dev server with HMR in the container.
    summary: |
      Start Vite dev server for hot module replacement.
      This runs in the foreground - use Ctrl+C to stop.
      For background execution, use: task docker:vite &
    cmds:
      - docker exec -it restarters npm run dev

  docker:vite:start:
    desc: Start Vite dev server in the background.
    summary: |
      Start Vite dev server in background (detached mode).
      Use 'task docker:vite:stop' to stop it.
    cmds:
      - docker exec -d restarters npm run dev
      - echo "Vite dev server started in background"

  docker:vite:stop:
    desc: Stop Vite dev server running in the container.
    cmds:
      - docker exec restarters bash -c "ps aux | grep 'node.*vite' | grep -v grep | awk '{print $$2}' | xargs -r kill || true"
      - echo "Vite dev server stopped"

  docker:test:phpunit:
    desc: Run PHPUnit tests in the core application container.
    summary: |
      Run PHPUnit tests with the same configuration used in CircleCI.
      This ensures consistency between local development and CI environments.

      The command includes:
      - Database reset and migrations (fresh test database state)
      - Memory limit set to 1024M
      - Coverage reporting (clover.xml)
      - JUnit XML output for CI integration
      - TeamCity output format for better test reporting
      - Coverage upload to Coveralls if COVERALLS_REPO_TOKEN is set
      - Support for additional PHPUnit options via CLI_ARGS

      Use this task instead of running phpunit directly to maintain consistency.

      Examples:
      - task docker:test:phpunit -- --stop-on-failure
      - task docker:test:phpunit -- --filter=UserTest

    cmds:
      - mkdir -p /tmp/test-results/phpunit
      - |
        # Always reset the test DB here (CI included). CI used to skip this,
        # relying on the container-startup migrate:fresh — but that runs with
        # no `set -e`, so a startup migration failure silently left the CI
        # test DB missing the newest tables (seen 2026-07-16: sso_tickets
        # absent while every earlier table existed). Explicit reset right
        # before phpunit is deterministic and matches local behaviour.
        echo "Resetting test database and running migrations..."
        docker exec restarters bash -c "php artisan migrate:fresh --seed --database=mysql_testing --force"
      - |
        # Coverage only where it's consumed: Coveralls tracks develop. The
        # CircleCI plan caps jobs at 60 minutes and the develop build already
        # takes ~54 — coverage-instrumented runs of the grown suite on feature
        # branches blew the cap (three kills at exactly 60.0 min, mid-test).
        # NOTE (pre-merge cliff, tracked in plan G1): once this branch merges,
        # develop's suite grows too — the build job needs a split or a plan
        # bump before then.
        if [ -n "$COVERALLS_REPO_TOKEN" ] && { [ -z "$CIRCLE_BRANCH" ] || [ "$CIRCLE_BRANCH" = "develop" ]; }; then
          docker exec -e COVERALLS_REPO_TOKEN="$COVERALLS_REPO_TOKEN" restarters bash -c "export XDEBUG_MODE=coverage; ./vendor/bin/phpunit -d memory_limit=1024M --bootstrap vendor/autoload.php --coverage-clover tests/clover.xml --log-junit /tmp/phpunit-results.xml --configuration ./phpunit.xml --teamcity {{ .CLI_ARGS }}"
        else
          docker exec restarters bash -c "export XDEBUG_MODE=off; ./vendor/bin/phpunit -d memory_limit=1024M --bootstrap vendor/autoload.php --log-junit /tmp/phpunit-results.xml --configuration ./phpunit.xml --teamcity {{ .CLI_ARGS }}"
        fi
      - |
        # Mirror the generation gate above: no clover.xml is produced on
        # non-develop CI branches, so there is nothing to upload there.
        if [ -n "$COVERALLS_REPO_TOKEN" ] && { [ -z "$CIRCLE_BRANCH" ] || [ "$CIRCLE_BRANCH" = "develop" ]; }; then
          echo "Uploading coverage to Coveralls..."
          docker exec -e COVERALLS_REPO_TOKEN="$COVERALLS_REPO_TOKEN" restarters bash -c "./upload-coverage.sh tests/clover.xml"
        else
          echo "COVERALLS_REPO_TOKEN not set, skipping coverage upload"
        fi

  docker:client:logs:
    desc: Tail the Nuxt client container logs.
    cmds:
      - docker logs --follow restarters_client

  docker:client:restart:
    desc: Restart the Nuxt client container (e.g. after changing client env vars).
    cmds:
      - "{{.DOCKER_CMD}} --profile core restart restarters_client"

  docker:test:vitest:
    desc: Run the client Vitest suite in the client container.
    summary: |
      Runs the Nuxt client's unit tests with JUnit output for CI integration.
    cmds:
      - mkdir -p /tmp/test-results/vitest
      - docker exec restarters_client npx vitest run --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - cp client/test-results/vitest.xml /tmp/test-results/vitest/results.xml

  playwright:seed-data:
    desc: Seed the fixed users/network/group the Playwright suites depend on.
    internal: true
    cmds:
      - docker exec restarters bash -c "php artisan cache:clear"
      - docker exec restarters bash -c "echo \"DB::statement('SET foreign_key_checks=0'); App\\\\Device::truncate(); DB::statement('SET foreign_key_checks=1');\" | php artisan tinker" || true
      - docker exec restarters bash -c "echo \"\\\$u=App\\\\User::firstOrCreate(['email'=>'jane@bloggs.net'], ['name'=>'Jane Bloggs','password'=>Hash::make('passw0rd'),'consent_past_data'=>'2021-01-01','consent_future_data'=>'2021-01-01','consent_gdpr'=>'2021-01-01']);\\\$u->role=2;\\\$u->save();\" | php artisan tinker" || true
      - |
        # Create test data for group tags tests (NC user, host user, network, group)
        docker exec restarters php artisan tinker --execute='$nc = App\User::firstOrCreate(["email"=>"nc@test.net"], ["name"=>"NC User","password"=>Hash::make("passw0rd"),"consent_past_data"=>"2021-01-01","consent_future_data"=>"2021-01-01","consent_gdpr"=>"2021-01-01"]); $nc->role=6; $nc->save(); $host = App\User::firstOrCreate(["email"=>"host@test.net"], ["name"=>"Host User","password"=>Hash::make("passw0rd"),"consent_past_data"=>"2021-01-01","consent_future_data"=>"2021-01-01","consent_gdpr"=>"2021-01-01"]); $host->role=3; $host->save(); $network = App\Network::where("name","Test London")->first(); if (!$network) { $network = new App\Network(); $network->name="Test London"; $network->shortname="testlondon"; $network->description="Test network"; $network->default_language="en"; $network->save(); } DB::table("user_network")->insertOrIgnore(["user_id"=>$nc->id,"network_id"=>$network->id]); $group = App\Group::firstOrCreate(["name"=>"Tag Test Group"], ["website"=>"https://test.example.com","location"=>"London","area"=>"London","postcode"=>"SW1A 1AA","latitude"=>51.5,"longitude"=>-0.1,"free_text"=>"Test group","approved"=>true]); DB::table("group_network")->insertOrIgnore(["group_id"=>$group->idgroups,"network_id"=>$network->id]); DB::table("users_groups")->insertOrIgnore(["user"=>$host->id,"group"=>$group->idgroups,"role"=>3,"status"=>1]); echo "Group tags test data: NC=".$nc->id." Host=".$host->id." Network=".$network->id." Group=".$group->idgroups;' || true
      - docker exec restarters bash -c "sed -i 's/APP_DEBUG=.*$/APP_DEBUG=false/g' /var/www/.env"
      - docker exec restarters bash -c "sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/g' /var/www/.env"
      - docker exec restarters bash -c "sed -i 's/MAIL_MAILER=.*/MAIL_MAILER=log/g' /var/www/.env"

  docker:test:playwright:client:
    desc: Run the client Playwright suite against the Nuxt container.
    summary: |
      End-to-end tests for the Nuxt SPA (client/e2e, playwright.client.config.js).
      The browser loads the SPA from the restarters_client container and the SPA
      calls the Laravel API via www.example.com:8001 (host-gateway).
    cmds:
      - mkdir -p /tmp/test-results/playwright
      - task: playwright:seed-data
      - |
        # Relax the auth-endpoint rate limit for test bursts (named limiter
        # reads AUTH_RATE_LIMIT; .env edits are the established pattern here).
        docker exec restarters bash -c "grep -q '^AUTH_RATE_LIMIT' /var/www/.env && sed -i 's/^AUTH_RATE_LIMIT=.*/AUTH_RATE_LIMIT=1000/' /var/www/.env || echo 'AUTH_RATE_LIMIT=1000' >> /var/www/.env; php artisan config:clear"
      - docker exec restarters_playwright bash -c "npx playwright install chromium"
      - |
        docker exec restarters_playwright bash -c "
          export PLAYWRIGHT_TEST=true
          export PLAYWRIGHT_BASE_URL=http://restarters_client:3000
          export PLAYWRIGHT_API_URL=http://www.example.com:8001
          export PW_TEST_HTML_REPORT_OPEN=never
          export FORCE_COLOR=1
          stdbuf -oL -eL npx playwright test --config=playwright.client.config.js --reporter=html {{ .CLI_ARGS }}
        "

  parity:capture:
    desc: Capture matched dev-vs-live screenshot pairs for visual parity diffing.
    summary: |
      Drives BOTH LOCAL DEV systems through the same page list at desktop +
      mobile, writing matched pairs to
      parity-shots/<viewport>/<slug>__{new,old}.png so they can be diffed
      side by side. The systematic replacement for eyeballing pages one at a time.

        new = the Nuxt SPA under development  (restarters_client:3000, :8004)
        old = the legacy Blade app from origin/develop
              (restarters_legacy_nginx, host :8005)

      Both run against the SAME seeded database with the same test login, so
      every difference is a real difference rather than production-vs-test-data
      noise - and because neither is production, non-read-only flows
      (create/edit wizards) can be exercised safely. No production credentials
      are involved anywhere.

      To stand up the legacy instance see
      docs/nuxt-migration/findings/parity-audit.md.

      Uses its own config (playwright.parity.config.js, testDir client/parity)
      so the CI suite never runs it.
    cmds:
      - mkdir -p parity-shots/desktop parity-shots/mobile
      # Same preconditions as docker:test:playwright:client - without the seeded
      # users the dev login has no account to log in as, and the auth rate limit
      # rejects the repeated logins this harness performs.
      - task: playwright:seed-data
      # Adds what seed-data does not (an event, a default 'restarters' network
      # for CheckForRepairNetwork) and publishes parity-fixtures.json, which
      # capture.spec.js reads to build the detail-page URLs. Must run every
      # time: migrate:fresh renumbers ids, and a stale id silently renders as
      # a 404 on both systems, which then compares as a false match.
      # NB `php artisan tinker <file>` exits 1 here even when the script runs
      # perfectly (psysh quirk - a trivial echo script exits 1 too), so its
      # exit code carries no information. Assert on the script's own end
      # marker instead. `< /dev/null` is required or tinker waits on stdin
      # forever.
      - |
        docker exec restarters bash -c "php artisan tinker parity-fixtures.php < /dev/null" 2>&1 \
          | grep -q 'FIXTURES .* END' \
          || { echo 'parity-fixtures.php did not complete - detail-page ids unavailable'; exit 1; }
      - |
        docker exec restarters bash -c "grep -q '^AUTH_RATE_LIMIT' /var/www/.env && sed -i 's/^AUTH_RATE_LIMIT=.*/AUTH_RATE_LIMIT=1000/' /var/www/.env || echo 'AUTH_RATE_LIMIT=1000' >> /var/www/.env; php artisan config:clear"
      - docker exec restarters_playwright bash -c "npx playwright install chromium"
      - |
        docker exec \
          -e PARITY_NEW_BASE="${PARITY_NEW_BASE:-http://restarters_client:3000}" \
          -e PARITY_OLD_BASE="${PARITY_OLD_BASE:-http://restarters_legacy_nginx}" \
          -e PARITY_EMAIL="${PARITY_EMAIL:-jane@bloggs.net}" \
          -e PARITY_PASSWORD="${PARITY_PASSWORD:-passw0rd}" \
          restarters_playwright bash -c "
            export PW_TEST_HTML_REPORT_OPEN=never
            export FORCE_COLOR=1
            stdbuf -oL -eL npx playwright test --config=playwright.parity.config.js --reporter=list {{ .CLI_ARGS }}
          "

  docker:wait-for-services-*:
    desc: Wait for Docker services to be ready and responding for a given profile (Usage - task docker:wait-for-services-[core|debug|discourse|all])
    summary: |
      Wait for Docker services to be ready by checking their health endpoints.
      This task will check that services are listening on their ports and returning
      plausible responses before proceeding, but only for the services in the specified profile.

      For just the core services, use:
      task docker:wait-for-services-core

      To include debug tools (phpMyAdmin, Mailhog), use:
      task docker:wait-for-services-debug

      To include Discourse services, use:
      task docker:wait-for-services-discourse

      To wait for all services, use:
      task docker:wait-for-services-all

      The task checks:
      - Core profile: MySQL database, Restarters web app
      - Debug profile: Core + phpMyAdmin, Mailhog
      - Discourse profile: Core + Discourse, PostgreSQL, Redis, Sidekiq
      - All profile: All services

    requires: *PROFILE_REQUIRES

    vars: *PROFILE_VARS

    silent: true

    cmds:
      - |
        # Cross-platform sleep function
        cross_platform_sleep() {
          if command -v sleep >/dev/null 2>&1; then
            sleep "$1"
          elif command -v powershell >/dev/null 2>&1; then
            powershell -Command "Start-Sleep -Seconds $1"
          else
            # Fallback using ping (works on most systems)
            ping -n $(($1 + 1)) 127.0.0.1 >/dev/null 2>&1 || ping -c $1 127.0.0.1 >/dev/null 2>&1
          fi
        }
        
        # Generic wait function that takes: service_name, container_name, check_command, max_attempts, sleep_interval
        wait_for_service() {
          local service_name="$1"
          local container_name="$2"
          local check_command="$3"
          local max_attempts="$4"
          local sleep_interval="$5"

          echo "Waiting for $service_name..."
          local attempt=0
          local initial_restart_count=0

          # Get initial restart count if container exists
          if docker ps -a --format "table {{.Names}}" | grep -q "^${container_name}$"; then
            initial_restart_count=$(docker inspect --format='{{.RestartCount}}' "$container_name" 2>/dev/null || echo "0")
          fi

          while [ $attempt -lt $max_attempts ]; do
            # Check if container has restarted since we started monitoring
            if docker ps -a --format "table {{.Names}}" | grep -q "^${container_name}$"; then
              current_restart_count=$(docker inspect --format='{{.RestartCount}}' "$container_name" 2>/dev/null || echo "0")
              if [ "$current_restart_count" -gt "$initial_restart_count" ]; then
                echo "❌ $service_name container ($container_name) has restarted during health check!"
                echo "   Initial restart count: $initial_restart_count"
                echo "   Current restart count: $current_restart_count"
                echo "   Container logs:"
                docker logs --tail=50 "$container_name" 2>&1 || echo "   Could not retrieve logs"
                exit 1
              fi
            fi

            if eval "$check_command" >/dev/null 2>&1; then
              echo "✓ $service_name is ready"
              return 0
            fi
            echo "  $service_name not ready, waiting... (attempt $((attempt + 1))/$max_attempts)"
            cross_platform_sleep "$sleep_interval"
            attempt=$((attempt + 1))
          done
          echo "❌ $service_name failed to start after $max_attempts attempts"
          exit 1
        }
        
        echo "Waiting for services in profile: {{.PROFILE}}"
        echo ""
        
        # Wait for core services (always needed)
        wait_for_service "MySQL database" "restarters_db" "docker exec restarters_db mysqladmin ping -h localhost -u root -ps3cr3t --silent" 60 5
        wait_for_service "Restarters web application" "restarters" "curl -f -s http://localhost:8001" 120 5

        # Wait for debug services (if in debug or all profile)
        {{- if or (eq .PROFILE "debug") (eq .PROFILE "all") }}
        wait_for_service "phpMyAdmin" "phpmyadmin" "curl -f -s http://localhost:8002" 60 5
        wait_for_service "Mailhog" "mailhog" "curl -f -s http://localhost:8026" 60 5
        {{- else }}
        echo "✓ phpMyAdmin not in profile {{.PROFILE}}, skipping"
        echo "✓ Mailhog not in profile {{.PROFILE}}, skipping"
        {{- end }}

        # Wait for discourse services (if in discourse or all profile)
        {{- if or (eq .PROFILE "discourse") (eq .PROFILE "all") }}
        wait_for_service "PostgreSQL" "postgresql" "docker exec postgresql pg_isready -U postgres" 60 5
        wait_for_service "Discourse" "restarters_discourse" "curl -f -s http://localhost:8003" 120 10
        {{- else }}
        echo "✓ PostgreSQL not in profile {{.PROFILE}}, skipping"
        echo "✓ Discourse not in profile {{.PROFILE}}, skipping"
        {{- end }}
      - echo "🎉 All services in profile {{.PROFILE}} are ready!"